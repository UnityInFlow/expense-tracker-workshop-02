server:
  port: 8080

# STEP 1 — SQLite setup: connect Spring to a SQLite file and run schema.sql on startup.
spring:
  datasource:
    url: jdbc:sqlite:expenses.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always

# ─── Logging: see what the app is doing (watch the IntelliJ Run console) ───
logging:
  level:
    web: DEBUG                                                   # incoming HTTP requests (dispatch)
    sql: DEBUG                                                   # SQL run via JdbcTemplate
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE  # the bound ?-parameter values
    dev.workshop.expense: DEBUG                                  # your own app package
